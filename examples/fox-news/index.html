<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Today's News | MysticWeb extension example</title>
<style>body{font:16px system-ui;margin:2rem auto;max-width:760px;padding:0 1rem}li{margin:1rem 0}small{color:#555}a{color:#1456a0}button{padding:.55rem 1rem;cursor:pointer}</style>
<h1>Today's News</h1>
<p>Headlines from <a href="https://www.foxnews.com/" rel="noopener noreferrer">Fox News</a>. Select a headline to read the original article.</p>
<button id="refresh" type="button">Refresh headlines</button>
<p id="status" role="status" aria-live="polite">Loading saved headlines…</p><ul id="articles"></ul>
<script type="module">
const status = document.querySelector("#status");
const list = document.querySelector("#articles");
const button = document.querySelector("#refresh");
async function displayNews() {
  const response = await fetch("/news.xml", { cache: "no-store" });
  if (!response.ok) throw new Error("No saved headlines yet. Select Refresh headlines.");
  const xml = new DOMParser().parseFromString(await response.text(), "application/xml");
  if (xml.querySelector("parsererror")) throw new Error("Invalid RSS data.");
  list.replaceChildren();
  for (const item of [...xml.querySelectorAll("channel > item")].slice(0, 25)) {
    const title = item.querySelector("title")?.textContent?.trim() ?? "Untitled";
    const href = item.querySelector("link")?.textContent?.trim() ?? "";
    let url;
    try { url = new URL(href); } catch { continue; }
    if (url.protocol !== "https:" || !/(^|\.)foxnews\.com$/i.test(url.hostname)) continue;
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.textContent = title;
    a.href = url.href;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    li.append(a);
    list.append(li);
  }
  status.textContent = `Showing ${list.children.length} saved headlines.`;
}
button.addEventListener("click", async () => {
  button.disabled = true;
  status.textContent = "Refreshing headlines…";
  try {
    const response = await fetch("/actions/refresh-news", { method: "POST", headers: { "Accept": "application/json" } });
    if (!response.ok) throw new Error(response.status === 409 ? "Refresh already in progress." : "Unable to refresh news.");
    await displayNews();
  } catch (error) { status.textContent = error.message; }
  finally { button.disabled = false; }
});
displayNews().catch(error => { status.textContent = error.message; });
</script></html>
